name: roturas
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  http_parser: ^4.1.2
  pdf: ^3.13.0
  printing: ^5.15.0
  shared_preferences: ^2.5.5
  local_auth: ^2.1.8 #Movido aquí para que la huella funcione en la APK compilada

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1 # Paquete para generar el nuevo logo

flutter:
  uses-material-design: true

  # 👈 Declaración del archivo de tu logo
  assets:
    - assets/logo.png

# 👈 Configuración del ícono para Android e iOS
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21