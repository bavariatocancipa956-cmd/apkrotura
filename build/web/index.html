<!DOCTYPE html>
<html>
<head>
  <!--
    Base href: Si subes tu web a un subdirectorio o dominio raíz,
    Flutter reemplazará automáticamente / al compilar.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema de Control de Roturas y Gestión de Envases">

  <!-- Configuración de Viewport para que se adapte a móviles y PC -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control de Roturas">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Control de Roturas - Gestión de Envases</title>
  <link rel="manifest" href="manifest.json">

  <!-- ESTILOS PARA LA PANTALLA DE CARGA (SPLASH SCREEN WEB) -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #0A3161 0%, #0D47A1 50%, #1565C0 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: white;
    }

    .icon-circle {
      width: 80px;
      height: 80px;
      background-color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    .icon-circle svg {
      width: 40px;
      height: 40px;
      fill: #0D47A1;
    }

    .app-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .app-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 500;
      margin-bottom: 24px;
    }

    /* Spinner de carga de CSS puro */
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>

<!-- PANTALLA DE ESPERA MIENTRAS CARGA FLUTTER -->
<div class="loading-container" id="loading-screen">
  <div class="icon-circle">
    <!-- Ícono vectorial de botella en SVG -->
    <svg viewBox="0 0 24 24">
      <path d="M10 2 v2 h4 v-2 h-4 z M10 5 v3 l-2 3 v9 a2 2 0 0 0 2 2 h4 a2 2 0 0 0 2-2 v-9 l-2-3 v-3 h-4 z"/>
    </svg>
  </div>
  <div class="app-title">CONTROL DE ROTURAS</div>
  <div class="app-subtitle">Gestión de Envases & Líneas de Llenado</div>
  <div class="spinner"></div>
</div>

<!--
  flutter_bootstrap.js carga y ejecuta tu aplicación en Web.
  Al inicializarse, Flutter reemplaza automáticamente el body o se superpone al loader.
-->
<script src="flutter_bootstrap.js" async></script>

</body>
</html>
